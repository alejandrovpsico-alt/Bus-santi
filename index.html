<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Bus</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0f0f0; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-filtrar { position: absolute; bottom: 20px; right: 20px; background: #007bff; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; }
    </style>
</head>
<body>
    <button class="btn-filtrar" onclick="filtrarBus()">Ver Mi Bus</button>
    <iframe id="mapa" src="https://montevideo.gub.uy"></iframe>
    <script>
        function filtrarBus() {
            const iframe = document.getElementById('mapa');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const selector = doc.getElementById('lineas');
            if (selector) {
                selector.value = "103"; // <-- CAMBIA AQUÍ EL NÚMERO DE TU BUS
                selector.dispatchEvent(new Event('change'));
            } else {
                alert("Espera a que cargue el mapa e intenta de nuevo");
            }
        }
    </script>
</body>
</html>
